name: Generate Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - version-15

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Install semantic-release and plugins
        run: |
          npm install semantic-release @semantic-release/changelog @semantic-release/exec @semantic-release/git @semantic-release/github --no-save

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: "alyf-linus"
          GIT_AUTHOR_EMAIL: "136631072+alyf-linus@users.noreply.github.com"
          GIT_COMMITTER_NAME: "alyf-linus"
          GIT_COMMITTER_EMAIL: "136631072+alyf-linus@users.noreply.github.com"
        run: npx semantic-release
